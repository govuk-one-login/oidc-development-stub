AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Generic OIDC stub running in a lambda

Parameters:
  Environment:
    Type: String
    Description: The name of the environment to deploy to
    AllowedValues:
      - dev
      - build
  CodeSigningConfigArn:
    Type: String
    Description: The ARN of the Code Signing Config to use, provided by the deployment pipeline
    Default: none
  PermissionsBoundary:
    Type: String
    Description: The ARN of the permissions boundary to apply when creating IAM roles
    Default: none
  VpcStackName:
    Type: String
    Description: The name of the stack used to create the VPC

Conditions:
  UseCodeSigning: !Not [!Equals [none, !Ref CodeSigningConfigArn]]
  UsePermissionsBoundary: !Not [!Equals [none, !Ref PermissionsBoundary]]
  IsLocalEnv: !Equals [!Ref Environment, local]

Globals:
  Function:
    CodeSigningConfigArn: !If
      - UseCodeSigning
      - !Ref CodeSigningConfigArn
      - !Ref AWS::NoValue
    PermissionsBoundary: !If
      - UsePermissionsBoundary
      - !Ref PermissionsBoundary
      - !Ref AWS::NoValue

Mappings:
  EnvironmentConfiguration:
    dev:
      domainName: "oidc-stub.manage.development.sign-in.service.gov.uk"
    build:
      domainName: "oidc-stub.manage.build.sign-in.service.gov.uk"

Resources:
  OidcStubApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub ${Environment}-OidcStubApiGateway
      StageName: prod
      AlwaysDeploy: true

  OidcStubViewsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: oidc-stub-nunjucks-templates
      Description: Nunjucks templates for OIDC interaction views
      ContentUri: ./src/views
      CompatibleRuntimes:
        - nodejs24.x

  GovUkFrontendLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: oidc-stub-govuk-frontend
      Description: govuk-frontend for OIDC stub interaction views
      ContentUri: ./govuk-frontend-layer
      CompatibleRuntimes:
        - nodejs24.x
    Metadata:
      BuildMethod: nodejs24.x

  OidcStubAssetsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: oidc-stub-assests
      Description: Static assets for oidc stub views
      ContentUri: ./public
      CompatibleRuntimes:
        - nodejs24.x

  OidcStubLambdaFunction:
    Type: AWS::Serverless::WebFunction
    Properties:
      CodeUri: dist/
      Runtime: nodejs24.x
      AutoDeploymentMode: LatestRevision
      Layers:
        - !Ref OidcStubViewsLayer
        - !Ref GovUkFrontendLayer
        - !Ref OidcStubAssetsLayer
      AuthType: IamAuth # ensure this requires IAM authorisation to invoke
      EndpointType: HomeRegion # Only stick to this region!
      Environment:
        Variables:
          ENVIRONMENT: !Sub ${Environment}
          # These will always be over-written when running locally in parameters.json
          FLOCI_ENDPOINT: !If [IsLocalEnv, "", !Ref AWS::NoValue]
          PROVIDER_ISSUER: !Sub
            - "https://${Domain}"
            - Domain:
                !FindInMap [
                  EnvironmentConfiguration,
                  !Ref Environment,
                  domainName,
                ]
      Policies:
        - !Ref OidcStubTableReadWriteDeleteAccessPolicy
        - !Ref OidcStubSecretAccessPolicy

  OidcStubKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS Customer Managed Key for node-oidc-provider DynamoDB table
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  OidcKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${Environment}-oidc-stub-data-key"
      TargetKeyId: !Ref OidcStubKmsKey

  # DynamoDB Table
  OidcDynamoDbTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Environment}-oidc-stub-data
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: userCode
          AttributeType: S
        - AttributeName: uid
          AttributeType: S
        - AttributeName: grantId
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userCode-index
          KeySchema:
            - AttributeName: userCode
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: uid-index
          KeySchema:
            - AttributeName: uid
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: grantId-index
          KeySchema:
            - AttributeName: grantId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref OidcStubKmsKey

  OidcStubTableReadWriteDeleteAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowReadWriteDeleteItemAccess
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
              - dynamodb:Query
              - dynamodb:Scan
            Resource:
              - !GetAtt OidcDynamoDbTable.Arn
              - !Sub "${OidcDynamoDbTable.Arn}/index/*"
          - Sid: AllowTableKeyAccess
            Effect: Allow
            Action:
              - kms:Encrypt
              - kms:Decrypt
            Resource:
              - !GetAtt OidcStubKmsKey.Arn

  OidcStubSecretAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowGetStubConfigSecrets
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}-oidc-provider-ec-signing-key-*"
              - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}-oidc-stub-client-config-*"

  # Domain Config

  OidcStubCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName:
        !FindInMap [EnvironmentConfiguration, !Ref Environment, domainName]
      DomainValidationOptions:
        - DomainName:
            !FindInMap [EnvironmentConfiguration, !Ref Environment, domainName]
          HostedZoneId: !ImportValue hosted-zone-HostedZoneID # Stack name hardcoded from here: https://github.com/govuk-one-login/relying-party-admin-tool/blob/main/infra/hosted_zone.tf#L2
      ValidationMethod: DNS

  OidcStubApiDomain:
    Type: AWS::ApiGateway::DomainName
    Properties:
      DomainName:
        !FindInMap [EnvironmentConfiguration, !Ref Environment, domainName]
      SecurityPolicy: TLS_1_2
      RegionalCertificateArn: !Ref OidcStubCertificate
      EndpointConfiguration:
        Types:
          - REGIONAL

  OidcStubApiMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Properties:
      DomainName:
        !FindInMap [EnvironmentConfiguration, !Ref Environment, domainName]
      RestApiId: !Ref OidcStubApiGateway
      Stage: prod
    DependsOn:
      - OidcStubApiDomain

  OidcStubDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      Type: A
      Name: !FindInMap [EnvironmentConfiguration, !Ref Environment, domainName]
      HostedZoneId: !ImportValue hosted-zone-HostedZoneID # Stack name hardcoded from here: https://github.com/govuk-one-login/relying-party-admin-tool/blob/main/infra/hosted_zone.tf#L2
      AliasTarget:
        DNSName: !GetAtt OidcStubApiDomain.RegionalDomainName
        HostedZoneId: !GetAtt OidcStubApiDomain.RegionalHostedZoneId
